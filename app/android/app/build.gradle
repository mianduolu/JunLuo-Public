 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def phoneRestrictionAppearanceAssets = file("$buildDir/generated/phoneRestrictionAppearanceAssets")
tasks.register('syncPhoneRestrictionAppearanceAssets', Sync) {
    from("$projectRoot/assets/appearance") { include 'home-and-chat.json' }
    from("$projectRoot/assets/images") { include 'you-portrait-neutral.png', 'me-portrait-default.png' }
    into phoneRestrictionAppearanceAssets
}
tasks.named('preBuild').configure { dependsOn 'syncPhoneRestrictionAppearanceAssets' }

android {
    sourceSets.main.assets.srcDir phoneRestrictionAppearanceAssets
    ndkVersion rootProject.ext.ndkVersion

    // play-services-location 21.4.0 exposes Kotlin 2.3 metadata, while the
    // current Expo toolchain compiles the app with Kotlin 2.1. We only use its
    // stable Java Activity Recognition API, so allow the app compiler to read it.
    kotlinOptions {
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.anonymous.junluo'
    defaultConfig {
        applicationId findProperty('junluoApplicationId') ?: 'com.anonymous.junluo.trial'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [googleMapsApiKey: googleMapsApiKey]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // @generated begin JunLuo CameraX dependencies
    implementation("androidx.camera:camera-core:1.6.1")
    implementation("androidx.camera:camera-camera2:1.6.1")
    implementation("androidx.camera:camera-lifecycle:1.6.1")
    implementation("androidx.camera:camera-view:1.6.1")
    implementation("androidx.exifinterface:exifinterface:1.4.2")
    implementation("com.google.android.gms:play-services-location:21.4.0")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20180813")
    // @generated end JunLuo CameraX dependencies

    // Redmi's platform provider does not expose Ed25519 KeyFactory; keep the
    // object protocol unchanged and sign native 4 MiB chunks with BC instead.
    implementation("org.bouncycastle:bcprov-jdk18on:1.84")

    // Kotlin coroutines for async polling in the foreground service
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Native voice-call uplink must not pass realtime PCM through the React Native bridge.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Compile only the pinned manager Java class; retain the original Maven AAR/native libraries.
def reactNativePackage = new File(rootDir.parentFile, 'node_modules/react-native/package.json')
if (new JsonSlurper().parse(reactNativePackage).version != '0.81.5') {
    throw new GradleException('React context lifecycle repair requires React Native 0.81.5')
}

interface JunLuoReactContextLifecycleParameters extends InstrumentationParameters {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    DirectoryProperty getReplacementClasses()
}

@CompileStatic
abstract class JunLuoReactContextLifecycleFactory
        implements AsmClassVisitorFactory<JunLuoReactContextLifecycleParameters> {
    static final String TARGET_CLASS = 'com.facebook.react.ReactInstanceManager'

    @Override
    boolean isInstrumentable(ClassData classData) {
        return classData.className == TARGET_CLASS || classData.className.startsWith(TARGET_CLASS + '$')
    }

    @Override
    ClassVisitor createClassVisitor(ClassContext classContext, ClassVisitor nextClassVisitor) {
        String className = classContext.currentClassData.className.replace('.', '/')
        File replacement = new File(parameters.get().replacementClasses.get().asFile, className + '.class')
        if (!replacement.isFile()) {
            throw new GradleException('Missing RN lifecycle replacement: ' + className)
        }
        byte[] replacementBytes = replacement.bytes
        if (new ClassReader(replacementBytes).className != className) {
            throw new GradleException('RN lifecycle replacement name mismatch: ' + className)
        }
        // Absorb the original class, then emit exactly one replacement to AGP.
        return new ClassVisitor(Opcodes.ASM9) {
            @Override
            void visitEnd() {
                new ClassReader(replacementBytes).accept(nextClassVisitor, 0)
            }
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantName = variant.name.capitalize()
    def patchedSource = layout.buildDirectory.file(
            "generated/reactContextLifecycle/${variant.name}/com/facebook/react/ReactInstanceManager.java")
    def rnSource = new File(rootDir.parentFile,
            'node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/ReactInstanceManager.java')
    def patchScript = new File(rootDir.parentFile, 'scripts/react-native-context-lifecycle-patch.cjs')
    def cleanupHelper = file('src/main/java/com/anonymous/junluo/ReactContextLoaderCleanup.java')
    def generatePatch = tasks.register("generate${variantName}ReactContextLifecycle", Exec) {
        inputs.files(rnSource, reactNativePackage, patchScript)
        outputs.file(patchedSource)
        commandLine 'node', patchScript.absolutePath, rnSource.absolutePath,
                patchedSource.get().asFile.absolutePath
    }
    def compilePatch = tasks.register("compile${variantName}ReactContextLifecycle", JavaCompile) {
        dependsOn generatePatch
        source patchedSource
        source cleanupHelper
        // Compile artifacts, never the instrumented runtime/DEX/App compilation output.
        classpath = variant.compileClasspath + files(android.bootClasspath)
        destinationDirectory.set(layout.buildDirectory.dir("intermediates/reactContextLifecycle/${variant.name}"))
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.encoding = 'UTF-8'
        options.incremental = false
        options.sourcepath = files()
        options.compilerArgs.add('-proc:none')
        doLast {
            def family = fileTree(destinationDirectory.get().asFile) {
                include 'com/facebook/react/ReactInstanceManager*.class'
            }.files.collect { it.name }.toSet()
            def expected = [
                'ReactInstanceManager.class', 'ReactInstanceManager$1.class',
                'ReactInstanceManager$2.class', 'ReactInstanceManager$3.class',
                'ReactInstanceManager$4.class', 'ReactInstanceManager$InspectorTargetDelegateImpl.class',
                'ReactInstanceManager$InspectorTargetDelegateImpl$1.class',
                'ReactInstanceManager$ReactContextInitParams.class',
                'ReactInstanceManager$ReactInstanceEventListener.class',
            ].toSet()
            if (family != expected) throw new GradleException('RN lifecycle class family changed: ' + family)
        }
    }
    // AGP's external artifact transforms snapshot parameter paths without wiring
    // their producer task. Run the compiler before any bytecode consumer.
    tasks.configureEach { task ->
        if (task.name in ["mergeExtDex${variantName}", "transform${variantName}ClassesWithAsm",
                "minify${variantName}WithR8"]) {
            task.dependsOn compilePatch
        }
    }
    variant.instrumentation.transformClassesWith(
            JunLuoReactContextLifecycleFactory, InstrumentationScope.ALL) { parameters ->
        parameters.replacementClasses.set(compilePatch.flatMap { it.destinationDirectory })
    }
    variant.instrumentation.setAsmFramesComputationMode(
            FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS)
}
