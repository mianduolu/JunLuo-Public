pluginManagement {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

// Keep native builds below Windows' legacy path limit when pnpm autolinking
// resolves packages through its long virtual-store paths.
if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
  def shortExpoModulesCoreDir = file("../node_modules/expo-modules-core/android")
  def expoModulesCoreProject = findProject(":expo-modules-core")
  if (expoModulesCoreProject != null && shortExpoModulesCoreDir.exists()) {
    expoModulesCoreProject.projectDir = shortExpoModulesCoreDir
  }

  def shortReanimatedDir = file("../node_modules/react-native-reanimated/android")
  def reanimatedProject = findProject(":react-native-reanimated")
  if (reanimatedProject != null && shortReanimatedDir.exists()) {
    reanimatedProject.projectDir = shortReanimatedDir
  }

  def shortSkiaDir = file("../node_modules/@shopify/react-native-skia/android")
  def skiaProject = findProject(":shopify_react-native-skia")
  if (skiaProject != null && shortSkiaDir.exists()) {
    skiaProject.projectDir = shortSkiaDir
  }
}

rootProject.name = '君落'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
